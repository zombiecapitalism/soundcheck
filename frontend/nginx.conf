# SPA + API 리버스 프록시 — 같은 오리진이므로 CORS 설정이 필요 없다.
server {
    listen 80;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 곡 이야기 SSE 스트리밍 — 버퍼링하면 점진 표시가 죽고,
        # 업스트림 기본이 HTTP/1.0이라 장기 연결에는 1.1을 명시한다
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # 해시 파일명 자산은 불변 — 1년 캐시
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 매번 재검증 — 휴리스틱 캐시된 옛 index가 삭제된 해시 자산을
    # 참조하면 재배포 직후 흰 화면이 난다
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /usr/share/nginx/html;
        # SPA 히스토리 라우팅 — 새로고침/딥링크가 index.html로 떨어져야 한다
        try_files $uri /index.html;
    }
}
