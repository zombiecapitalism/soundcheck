# CI — 빌드 + 테스트. 배포는 하지 않는다(수동 절차는 README 참고).
# 백엔드 테스트는 Testcontainers(pgvector)를 쓰므로 Docker가 있는 러너가 필요하다
# (ubuntu-latest 기본 제공). 외부 API 키는 필요 없다 — 테스트는 전부 목/픽스처이고
# 더미 값은 src/test/resources/application.properties가 공급한다.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test
        run: ./gradlew build --console=plain

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm run test -- --run
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npx oxlint src
      - name: Build
        run: npm run build
