# 운영 구성 — 클라우드 1대(PRD 6.2). 로컬 개발은 docker-compose.yml(DB만)을 쓴다.
# 실행: docker compose --env-file .env -f docker-compose.prod.yml up -d --build
#
# [실배포 전 필수 — TLS] 이 구성은 80 포트 평문이다. 관리자 Basic 인증이 평문으로 나가면
# 자격증명이 그대로 노출되므로, 도메인 확보 후 web 앞에 TLS 종단을 반드시 세울 것.
# 권장: Caddy(자동 Let's Encrypt) 컨테이너를 web 앞에 추가하거나 클라우드 LB의 TLS 종단 사용.
# 애플리케이션 쪽 대비는 되어 있다: 로그인 시도 제한(AdminLoginGuard), XFF 마지막 항목 신뢰.
services:
  db:
    image: pgvector/pgvector:0.8.5-pg16-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-encore}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # 개발 compose와 달리 호스트 포트를 열지 않는다 — 앱만 내부 네트워크로 접근
    volumes:
      - encore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-encore}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-encore}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SETLIST_FM_API_KEY: ${SETLIST_FM_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_CONTACT: ${RAG_CONTACT:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  encore-postgres-data:
